<div class="preview-table">
  @if (!csvData || csvData.headers.length === 0) {
    <div class="empty-state">
      <i class="pi pi-table"></i>
      <p>Žiadne dáta</p>
    </div>
  } @else {
    <div class="table-container">
      <p-table
        [value]="rows"
        [columns]="csvData.headers"
        [scrollable]="true"
        scrollHeight="flex"
        scrollDirection="both"
        [stripedRows]="true"
        styleClass="p-datatable-sm inline-select-table">

        <ng-template #header let-columns>
          <tr>
            <th class="row-select-col" (click)="toggleAllRows()">
              <p-checkbox
                [binary]="true"
                [ngModel]="allRowsSelected"
                (click)="$event.stopPropagation()"
                (ngModelChange)="toggleAllRows()">
              </p-checkbox>
            </th>
            @for (col of columns; track col) {
              <th
                [class.selected-col]="isColumnSelected(col)"
                [style.min-width]="'160px'"
                [style.max-width]="'220px'"
                (click)="toggleColumn(col)"
                class="col-header">
                <div class="col-header-inner">
                  <p-checkbox
                    [binary]="true"
                    [ngModel]="isColumnSelected(col)"
                    (click)="$event.stopPropagation()"
                    (ngModelChange)="toggleColumn(col)">
                  </p-checkbox>
                  <span class="col-name" [title]="col">{{ col }}</span>
                </div>
              </th>
            }
          </tr>
        </ng-template>

        <ng-template #body let-row let-rowIndex="rowIndex" let-columns="columns">
          <tr [class.row-selected]="isRowSelected(rowIndex)" [class.row-deselected]="!isRowSelected(rowIndex)">
            <td class="row-select-col" (click)="toggleRow(rowIndex)">
              <p-checkbox
                [binary]="true"
                [ngModel]="isRowSelected(rowIndex)"
                (click)="$event.stopPropagation()"
                (ngModelChange)="toggleRow(rowIndex)">
              </p-checkbox>
            </td>
            @for (col of columns; track col) {
              <td
                [class.selected-col]="isColumnSelected(col)"
                [style.min-width]="'160px'"
                [style.max-width]="'220px'">
                <span class="cell-text" [title]="row[col]">{{ row[col] }}</span>
              </td>
            }
          </tr>
        </ng-template>

      </p-table>
    </div>
  }
</div>
